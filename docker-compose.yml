# Scheduler only. Ollama é acessado via HTTP (OLLAMA_BASE_URL no .env.local), sem serviço Ollama neste compose.
services:
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: originlab-scheduler
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      TZ: UTC
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
      # OLLAMA_BASE_URL, OLLAMA_MODEL, etc. vêm do .env.local (ex.: servidor remoto).
    # Optional: persist logs/locks if you want
    # volumes:
    #   - originlab-scheduler-tmp:/tmp

# Para Ollama local + ollama-init (pull de modelos), use um override ou perfil separado.
